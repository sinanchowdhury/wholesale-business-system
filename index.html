<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wholesale Business System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #1f2937;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 240px;
            background: #111827;
            color: white;
            padding: 22px 15px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 30px;
        }

        .brand span {
            color: #60a5fa;
        }

        .menu-title {
            font-size: 11px;
            color: #9ca3af;
            padding: 10px;
            text-transform: uppercase;
        }

        .menu button {
            width: 100%;
            border: none;
            background: transparent;
            color: #d1d5db;
            text-align: left;
            padding: 12px 10px;
            margin: 2px 0;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .menu button:hover {
            background: #1f2937;
            color: white;
        }

        .menu button.active {
            background: #2563eb;
            color: white;
        }

        /* MAIN */

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
        }

        .topbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .topbar h2 {
            font-size: 20px;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .content {
            padding: 30px;
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
        }

        .card-title {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 25px;
            font-weight: bold;
        }

        /* CONTENT BOX */

        .box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .box-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;
            font-weight: bold;
        }

        .box-body {
            padding: 20px;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #9ca3af;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {

            .sidebar {
                width: 65px;
                padding: 15px 8px;
            }

            .brand {
                font-size: 0;
                text-align: center;
            }

            .brand span {
                font-size: 20px;
            }

            .menu-title {
                display: none;
            }

            .menu button {
                font-size: 0;
                text-align: center;
                padding: 14px 5px;
            }

            .menu button::first-letter {
                font-size: 18px;
            }

            .main {
                margin-left: 65px;
                width: calc(100% - 65px);
            }

            .topbar {
                padding: 0 15px;
            }

            .topbar h2 {
                font-size: 16px;
            }

            .content {
                padding: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- LOGIN SYSTEM -->

<div id="authScreen" style="
position:fixed;
inset:0;
background:#f5f7fb;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
">

<div style="
width:350px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.12);
">

<h2 id="authTitle" style="text-align:center;">Login</h2>

<input id="authEmail"
type="email"
placeholder="Email"
style="width:100%;padding:12px;margin:8px 0;box-sizing:border-box;">

<input id="authPassword"
type="password"
placeholder="Password"
style="width:100%;padding:12px;margin:8px 0;box-sizing:border-box;">

<button onclick="handleAuth()"
style="width:100%;padding:12px;margin-top:10px;">
<span id="authButtonText">Login</span>
</button>

<p id="authMessage" style="text-align:center;"></p>

<p style="text-align:center;">
<span id="authSwitchText">Don't have an account?</span>

<button onclick="switchAuthMode()"
style="border:none;background:none;color:#2563eb;">
<span id="authSwitchButton">Sign Up</span>
</button>
</p>

</div>
</div>

<script>

let authMode = "login";

function switchAuthMode() {

    if (authMode === "login") {

        authMode = "signup";

        document.getElementById("authTitle").innerText = "Create Account";
        document.getElementById("authButtonText").innerText = "Sign Up";
        document.getElementById("authSwitchText").innerText =
            "Already have an account?";
        document.getElementById("authSwitchButton").innerText = "Login";

    } else {

        authMode = "login";

        document.getElementById("authTitle").innerText = "Login";
        document.getElementById("authButtonText").innerText = "Login";
        document.getElementById("authSwitchText").innerText =
            "Don't have an account?";
        document.getElementById("authSwitchButton").innerText = "Sign Up";
    }
}

async function handleAuth() {

    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    const message = document.getElementById("authMessage");

    if (!email || !password) {
        message.innerText = "Email এবং Password দিন।";
        return;
    }

    message.innerText = "Please wait...";

    if (authMode === "signup") {

        const { error } = await supabaseClient.auth.signUp({
            email: email,
            password: password
        });

        if (error) {
            message.innerText = error.message;
            return;
        }

        message.innerText =
            "Account তৈরি হয়েছে। Email verify করুন।";

    } else {

        const { error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            message.innerText = error.message;
            return;
        }

        message.innerText = "Login successful!";

        setTimeout(() => {
            document.getElementById("authScreen").style.display = "none";
        }, 500);
    }
}

async function checkLogin() {

    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
        document.getElementById("authScreen").style.display = "none";
    }
}

checkLogin();

</script>
