<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wholesale Business System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #1f2937;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 240px;
            background: #111827;
            color: white;
            padding: 22px 15px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 30px;
        }

        .brand span {
            color: #60a5fa;
        }

        .menu-title {
            font-size: 11px;
            color: #9ca3af;
            padding: 10px;
            text-transform: uppercase;
        }

        .menu button {
            width: 100%;
            border: none;
            background: transparent;
            color: #d1d5db;
            text-align: left;
            padding: 12px 10px;
            margin: 2px 0;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .menu button:hover {
            background: #1f2937;
            color: white;
        }

        .menu button.active {
            background: #2563eb;
            color: white;
        }

        /* MAIN */

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
        }

        .topbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .topbar h2 {
            font-size: 20px;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .content {
            padding: 30px;
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
        }

        .card-title {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 25px;
            font-weight: bold;
        }

        /* CONTENT BOX */

        .box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .box-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;
            font-weight: bold;
        }

        .box-body {
            padding: 20px;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #9ca3af;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {

            .sidebar {
                width: 65px;
                padding: 15px 8px;
            }

            .brand {
                font-size: 0;
                text-align: center;
            }

            .brand span {
                font-size: 20px;
            }

            .menu-title {
                display: none;
            }

            .menu button {
                font-size: 0;
                text-align: center;
                padding: 14px 5px;
            }

            .menu button::first-letter {
                font-size: 18px;
            }

            .main {
                margin-left: 65px;
                width: calc(100% - 65px);
            }

            .topbar {
                padding: 0 15px;
            }

            .topbar h2 {
                font-size: 16px;
            }

            .content {
                padding: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">
            WHOLESALE <span>SYS</span>
        </div>

        <div class="menu-title">
            Management
        </div>

        <div class="menu">

            <button class="active">
                📊 Dashboard
            </button>

            <button>
                📦 Products
            </button>

            <button>
                🏭 Production
            </button>

            <button>
                🏪 Stores
            </button>

            <button>
                🧾 Sales
            </button>

            <button>
                💰 Expenses
            </button>

            <button>
                📈 Reports
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <h2>Dashboard</h2>

            <div class="user">

                <div>
                    Sinan
                </div>

                <div class="avatar">
                    S
                </div>

            </div>

        </header>


        <section class="content">

            <!-- SUMMARY CARDS -->

            <div class="cards">

                <div class="card">
                    <div class="card-title">
                        Total Sales
                    </div>

                    <div class="card-value">
                        ৳0
                    </div>
                </div>


                <div class="card">
                    <div class="card-title">
                        Total Profit
                    </div>

                    <div class="card-value">
                        ৳0
                    </div>
                </div>


                <div class="card">
                    <div class="card-title">
                        Products
                    </div>

                    <div class="card-value">
                        0
                    </div>
                </div>


                <div class="card">
                    <div class="card-title">
                        Stores
                    </div>

                    <div class="card-value">
                        0
                    </div>
                </div>

            </div>


            <!-- RECENT SALES -->

            <div class="box">

                <div class="box-header">
                    Recent Sales
                </div>

                <div class="box-body">

                    <div class="empty">
                        No sales recorded yet.
                    </div>

                </div>

            </div>


            <!-- STOCK -->

            <div class="box">

                <div class="box-header">
                    Stock Overview
                </div>

                <div class="box-body">

                    <div class="empty">
                        No products added yet.
                    </div>

                </div>

            </div>

        </section>

    </main>

</div>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://zyyolktijcesfvutdhhb.supabase.co";

    // তোমার Supabase Settings → API Keys থেকে Publishable key বসাও
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_q5pjAKLBylQTi-hht5OiRA_K0QCCWFa";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    async function testSupabaseConnection() {

        console.log("Connecting to Supabase...");

        const { data, error } = await supabaseClient
            .from("products")
            .select("id")
            .limit(1);

        if (error) {
            console.error("Supabase Error:", error);
            return;
        }

        console.log("Supabase Connected Successfully!");
        console.log("Products:", data);
    }

    testSupabaseConnection();
</script>
</body>
</html>
